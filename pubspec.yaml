name: unitec_entregas
description: Aplicativo de entregas do Unitec ERP (offline-first, motoristas).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  uuid: ^4.5.1
  device_info_plus: ^10.1.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  signature: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
